hamiltonian: heisenberg
n_sites: 40
t: 0.25
J:
- 1.
- 1.
- -0.5
h:
- 0.75
- 0.
- 0.
disordered: False
n_id_layers: 0
first_layer_odd: True
truncation_dim: 32
rel_tol: 1.0e-11
abs_tol: 1.0e-14
